# Herdr configuration
# Docs: https://herdr.dev/docs/config-reference/
#
# Only non-default values live here -- everything else follows herdr's built-in
# defaults. Each entry carries the default it overrides, so the intent stays
# obvious. Validate changes with `herdr config check`.

# Skip first-run onboarding prompts after this dotfile is stowed.
onboarding = false

[theme]
name = "kanagawa"

[terminal]
default_shell = "/bin/zsh"
# default "auto" -- force a login shell so .zprofile/.zlogin run in every pane.
shell_mode = "login"

[worktrees]
# default "~/.herdr/worktrees" -- keep agent worktrees beside the projects.
directory = "~/Projects/.worktrees"

[keys]
# default "ctrl+b" -- matches the tmux prefix in tmux/.config/tmux/tmux.conf.
prefix = "ctrl+s"

# Fast access to the tools used most often in this dotfiles setup.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+alt+t"
type = "popup"
command = "htop"
width = "80%"
height = "80%"

[ui]
# default false -- label each pane border with the agent running in it.
show_agent_labels_on_pane_borders = true

[ui.toast]
# default "off" -- render agent notifications inside the terminal.
delivery = "terminal"
