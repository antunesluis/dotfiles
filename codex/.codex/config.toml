# Global Codex CLI configuration.
# Do not store auth.json, history, caches, sqlite state, or logs in dotfiles.

model = "gpt-5.5"
model_reasoning_effort = "high"

[tui]
theme = "gruvbox-dark"

# Context window usage in the footer. Codex only ships fixed status-line items,
# so this renders "Context 16% used" -- percentage only, no absolute token
# counts. Unset, the default is ["model-with-reasoning", "current-dir"].
status_line = ["model-with-reasoning", "current-dir", "context-used"]

[features]
hooks = true

[projects."/home/antunesluis"]
trust_level = "trusted"

[projects."/home/antunesluis/Projects/Github/antunesluis.com.br"]
trust_level = "trusted"

[projects."/home/antunesluis/dotfiles"]
trust_level = "trusted"
